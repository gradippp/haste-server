name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (a test devDependency) requires Node ^22.22.2 /
          # ^24.15.0 / >=26 — keep this in sync with that constraint.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t haste-server:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name haste-ci -p 3000:3000 \
            -e STORAGE_TYPE=file -e STORAGE_FILEPATH=/app/data \
            haste-server:ci

          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done

          key=$(curl -sf -X POST --data 'ci smoke test' \
            http://localhost:3000/documents | sed 's/.*"key":"\([^"]*\)".*/\1/')
          test -n "$key"
          test "$(curl -sf http://localhost:3000/raw/$key)" = "ci smoke test"

      - name: Container logs
        if: failure()
        run: docker logs haste-ci
