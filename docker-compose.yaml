services:
  haste-server:
    build: .
    ports:
      - "3000:3000"
    environment:
      STORAGE_TYPE: redis
      STORAGE_HOST: redis
      STORAGE_PORT: 6379
      STORAGE_DB: 0
      # Documents expire after 30 days. Remove to keep them forever.
      STORAGE_EXPIRE_SECONDS: 2592000
      KEYGENERATOR_TYPE: phonetic
      KEY_LENGTH: 10
      MAX_LENGTH: 400000
      LOGGING_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:

